<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example Astrophotography</title>
  <style>
    body {
      margin: 0 auto;
      padding: 16px;
      max-width: 900px;
      background: #0b0d12;
      color: #e6e6e6;
      font-family: system-ui, sans-serif;
    }
    h1 { font-weight: 600; }
    figure { margin: 0 0 48px; }
    img { display: block; max-width: 100%; height: auto; }
    figcaption { margin-bottom: 8px; color: #b8bcc6; }
  </style>
</head>
<body>
  <h1>Example Astrophotography</h1>

  <figure>
    <figcaption>Edge-on galaxy NGC 891 (Caldwell 23), Seestar S50, 2026-11-13</figcaption>
    <a href="images/Edge-on%20galaxy%20NGC%20891%20(Caldwell%2023),%20Seestar%20S50,%202026-11-13.jpg"><img src="images/Edge-on%20galaxy%20NGC%20891%20(Caldwell%2023),%20Seestar%20S50,%202026-11-13.jpg" alt="Edge-on galaxy NGC 891 (Caldwell 23), Seestar S50, 2026-11-13" width="2160" height="3840"></a>
  </figure>

  <figure>
    <figcaption>Orion Nebula M42, Seestar S50, 2026-03-17</figcaption>
    <a href="images/Orion%20Nebula%20M42,%20Seestar%20S50,%202026-03-17.jpg"><img src="images/Orion%20Nebula%20M42,%20Seestar%20S50,%202026-03-17.jpg" alt="Orion Nebula M42, Seestar S50, 2026-03-17" width="1080" height="1920"></a>
  </figure>

  <figure>
    <figcaption>Whirlpool Galaxy M51, Seestar S50, 2026-03-17</figcaption>
    <a href="images/Whirlpool%20Galaxy%20M51,%20Seestar%20S50,%202026-03-17.jpg"><img src="images/Whirlpool%20Galaxy%20M51,%20Seestar%20S50,%202026-03-17.jpg" alt="Whirlpool Galaxy M51, Seestar S50, 2026-03-17" width="1080" height="1920"></a>
  </figure>

  <figure>
    <figcaption>Open clusters M38 and NGC 1907, Seestar S50, 2026-03-21</figcaption>
    <a href="images/Open%20clusters%20M38%20and%20NGC%201907,%20Seestar%20S50,%202026-03-21.jpg"><img src="images/Open%20clusters%20M38%20and%20NGC%201907,%20Seestar%20S50,%202026-03-21.jpg" alt="Open clusters M38 and NGC 1907, Seestar S50, 2026-03-21" width="1080" height="1920"></a>
  </figure>

  <figure>
    <figcaption>Partial solar eclipse, Seestar S50, 2026-08-12</figcaption>
    <a href="images/Partial%20solar%20eclipse,%20Seestar%20S50,%202026-08-12.jpg"><img src="images/Partial%20solar%20eclipse,%20Seestar%20S50,%202026-08-12.jpg" alt="Partial solar eclipse, Seestar S50, 2026-08-12" width="536" height="960"></a>
  </figure>

  <figure>
    <figcaption>Christmas Tree Cluster NGC 2264, Seestar S50, 2026-04-06</figcaption>
    <a href="images/Christmas%20Tree%20Cluster%20NGC%202264,%20Seestar%20S50,%202026-04-06.jpg"><img src="images/Christmas%20Tree%20Cluster%20NGC%202264,%20Seestar%20S50,%202026-04-06.jpg" alt="Christmas Tree Cluster NGC 2264, Seestar S50, 2026-04-06" width="2159" height="3839"></a>
  </figure>
</body>
</html>
